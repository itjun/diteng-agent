# electron-builder 配置（appId 采用倒序域名：后端 Java 命名空间 site.diteng.*（如 site.diteng.im）+
# 站点域名 diteng.vip / cdcp.site，客户端归属同一体系，故取 site.diteng.agent）
appId: site.diteng.agent
productName: diteng agent
directories:
  output: release
  buildResources: build
# 运行时产物：主/preload/renderer 编译输出 + 托盘图标 + package.json（main=dist/main/index.js）；
# 生产依赖（mqtt/react 等）由 electron-builder 自动按 pnpm-lock 收敛打入
files:
  - dist/**
  - assets/**
  - package.json
asar: true
mac:
  # 本机使用：不执行应用签名、公证，也不启用依赖签名的 Hardened Runtime。
  identity: null
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.business
  # 原生分层图标：系统负责深浅色、透明与染色外观，并自动生成旧版 ICNS 回退。
  icon: build/appicon.icon
dmg:
  icon: build/icon.icns
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: deb
      arch:
        - x64
        - arm64
  executableName: diteng-agent
  category: Office
  icon: build/icon.png
  maintainer: itjun <l1091462907@gmail.com>
publish:
  provider: github
  owner: itjun
  repo: diteng-agent
  releaseType: draft
